<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Order Management System</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#222a2e;--mute:#6b7478;--line:#e4e2dc;--acc:#0f6b5c}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--acc);color:#fff}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:22px 0 8px}
.badge{padding:3px 12px;border-radius:99px;font-size:12px;background:#ffffff33}.badge.ok{background:#2e7d4f}.badge.bad{background:#c0392b}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mute);font:inherit}
nav button.on{background:var(--acc);color:#fff}
main{padding:8px 24px 40px;max-width:1250px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.card b{display:block;font-size:26px}.card span{color:var(--mute);text-transform:capitalize}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;text-transform:uppercase;color:var(--mute)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select{padding:7px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);background:#fff}
form button{padding:8px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer;font:inherit}
.tag{padding:2px 9px;border-radius:99px;font-size:12px}.r{background:#fde8e6;color:#c0392b}.a{background:#fdf1d8;color:#9a6a12}.g{background:#e1f3e8;color:#2e7d4f}
#msg{margin:12px 24px 0;padding:9px 14px;border-radius:8px;display:none}#msg.ok{display:block;background:#e1f3e8;color:#2e7d4f}#msg.bad{display:block;background:#fde8e6;color:#c0392b}
</style></head><body>
<header><h1>Product Order Management System</h1><span id="status" class="badge">Connecting…</span></header>
<nav id="nav"></nav><div id="msg"></div><main id="view"></main>
<footer style="padding:14px 24px;font-size:12px;color:var(--mute)">Abhay Kumar, 25BCE2537</footer>
<script>
const TABS={dashboard:'Dashboard',orders:'Orders',products:'Products',customers:'Customers',suppliers:'Suppliers',payments:'Payments',shipments:'Shipments',reviews:'Returns & Reviews',sales:'Product Sales',reorder:'Reorder List',invoices:'Invoices'};
const TAG={Active:'g',Delivered:'g',Successful:'g',Published:'g','Refund Issued':'g',Shipped:'a','In Transit':'a',Processing:'a',Preparing:'a','On Hold':'a','Under Review':'a',Refunded:'a',Inactive:'r',Cancelled:'r',Failed:'r'};
const TAGCOLS=['standing','order_status','payment_status','delivery_status','status'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API=location.protocol==='file:'?'http://localhost:8081/':'';
async function api(path,body){
  const r=await fetch(API+'api/'+path,body?{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)}:{});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||'Request failed'); return d;
}
function toast(t,bad){const m=$('#msg');m.textContent=t;m.className=bad?'bad':'ok';setTimeout(()=>m.className='',5000)}
function cell(k,v){if(v==null)return '–';const s=esc(v);return TAGCOLS.includes(k)&&TAG[v]?`<span class="tag ${TAG[v]}">${s}</span>`:s}
function table(rows){
  if(!rows.length)return '<p>No rows.</p>';const k=Object.keys(rows[0]);
  return '<div class="scroll"><table><tr>'+k.map(x=>`<th>${x.replace(/_/g,' ')}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+k.map(x=>`<td>${cell(x,r[x])}</td>`).join('')+'</tr>').join('')+'</table></div>';
}
const opts=(rows,k,l)=>rows.map(r=>`<option value="${esc(r[k])}">${esc(r[k])} — ${esc(r[l])}</option>`).join('');
const sel=(n,h)=>`<select name="${n}" required>${h}</select>`;
const fld=(l,h)=>`<label>${l}${h}</label>`;
const list=a=>a.map(x=>`<option>${x}</option>`).join('');

async function show(t){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  let h='';
  try{
    const sum=(await api('summary'))[0]; $('#status').textContent='JDBC connected · MySQL'; $('#status').className='badge ok';
    if(t==='dashboard'){
      h='<div class="cards">'+Object.entries(sum).map(([k,v])=>`<div class="card"><b>${v}</b><span>${k.replace(/_/g,' ')}</span></div>`).join('')+'</div><h2>Recent orders</h2>'+table(await api('orders'));
    }else if(t==='orders'){
      const [cu,pr,or]=await Promise.all(['customers','products','orders'].map(x=>api(x)));
      pr.forEach(p=>p.label=`${p.product_name} · ₹${p.price} · stock ${p.stock_on_hand}`);
      const live=or.filter(o=>o.order_status==='Processing'||o.order_status==='Shipped').map(o=>({...o,label:`${o.customer_name} · ${o.order_status}`}));
      const proc=live.filter(o=>o.order_status==='Processing');
      h=`<h2>Place an order (stock, payment and shipment are created automatically)</h2><form data-a="orders/place">`+
        fld('Customer',sel('customer',opts(cu,'customer_number','full_name')))+fld('Product',sel('product',opts(pr,'product_number','label')))+
        fld('Quantity','<input name="quantity" type="number" min="1" value="1" required>')+fld('Payment method',sel('method',list(['UPI','Credit Card','Debit Card','Net Banking','Cash on Delivery'])))+
        fld('Delivery address','<input name="address" required>')+`<button>Place order</button></form>
        <h2>Advance an order (Processing → Shipped → Delivered)</h2><form data-a="orders/advance">`+
        fld('Order',sel('order',opts(live,'order_number','label')))+fld('Courier (when shipping)','<input name="courier" placeholder="Speedex Logistics">')+`<button>Advance</button></form>
        <h2>Cancel an order (Processing only: refunds and restocks)</h2><form data-a="orders/cancel">`+
        fld('Order',sel('order',opts(proc,'order_number','label')))+fld('Reason','<input name="reason" required>')+`<button>Cancel order</button></form><h2>All orders</h2>`+table(or);
    }else if(t==='products'){
      const pr=await api('products');
      h=`<h2>Restock a product</h2><form data-a="products/restock">`+fld('Product',sel('product',opts(pr,'product_number','product_name')))+
        fld('Quantity to add','<input name="quantity" type="number" min="1" required>')+`<button>Restock</button></form><h2>Products</h2>`+table(pr);
    }else if(t==='customers'){
      const cu=await api('customers');
      h=`<h2>Add customer</h2><form data-a="customers/add">`+fld('Name','<input name="name" required>')+fld('Email','<input name="email" type="email" required>')+
        fld('Phone','<input name="phone">')+fld('City','<input name="city">')+`<button>Add</button></form>
        <h2>Update standing</h2><form data-a="customers/standing">`+fld('Customer',sel('customer',opts(cu,'customer_number','full_name')))+fld('Standing',sel('standing',list(['Active','Inactive'])))+`<button>Update</button></form>
        <h2>Delete customer (fails if the customer has orders)</h2><form data-a="customers/delete">`+fld('Customer',sel('customer',opts(cu,'customer_number','full_name')))+`<button>Delete</button></form><h2>Customers</h2>`+table(cu);
    }else if(t==='reviews'){
      const [or,it,rv]=await Promise.all(['orders','items','reviews'].map(x=>api(x)));
      const o2=or.filter(o=>o.order_status==='Shipped'||o.order_status==='Delivered').map(o=>({...o,label:`${o.customer_name} · ${o.order_status}`}));
      const i2=it.filter(i=>i.order_status==='Shipped'||i.order_status==='Delivered').map(i=>({product_number:i.product_number,label:i.order_number+' · '+i.product_name}));
      h=`<h2>Add a review / damage report / return</h2><form data-a="reviews/add">`+fld('Order',sel('order',opts(o2,'order_number','label')))+
        fld('Product (must be in that order)',sel('product',opts(i2,'product_number','label')))+fld('Type',sel('type',list(['Review','Damage Report','Return'])))+
        fld('Rating 1-5 (reviews only)','<input name="rating" type="number" min="1" max="5" value="5">')+fld('Details','<input name="text" required>')+`<button>Submit</button></form><h2>Returns &amp; reviews</h2>`+table(rv);
    }else h=`<h2>${TABS[t]}</h2>`+table(await api(t));
  }catch(e){
    const down=e instanceof TypeError;
    $('#status').textContent=down?'Backend not running':'Database error'; $('#status').className='badge bad';
    h=down?'<h2>Backend not reachable</h2><p>Start the Java backend (double-click <b>start_shop.bat</b>, or run <code>java -cp ".;connector\\*" ShopServer</code>) and keep that window open.<br>Then open <b>http://localhost:8081</b>.</p>'
          :'<h2>Database error</h2><p>'+esc(e.message)+'</p><p>Check the MySQL password (ORDER_DB_PASS) and that warehouse/shop_schema.sql was loaded.</p>';
  }
  $('#view').innerHTML=h;
  document.querySelectorAll('form[data-a]').forEach(f=>f.addEventListener('submit',async e=>{
    e.preventDefault();
    try{const r=await api(f.dataset.a,Object.fromEntries(new FormData(f)));
      toast(r.order?`${r.order} placed, total ₹${r.total}`:r.reference?`${r.reference} recorded`:r.status?`Order is now ${r.status}`:'Saved');show(t);}
    catch(err){toast(err.message,true)}
  }));
}
$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}">${v}</button>`).join('');
$('#nav').addEventListener('click',e=>e.target.dataset.t&&show(e.target.dataset.t));
show('dashboard');
</script></body></html>
